# main-redis — production cache
# Sadece TLS dinlenir; plaintext port kapalı.

################################ NETWORK #####################################
bind 0.0.0.0
protected-mode yes
port 0
tls-port 6379
tcp-backlog 511
tcp-keepalive 300
timeout 0
maxclients 10000

################################## TLS #######################################
tls-cert-file /tls/redis.crt
tls-key-file /tls/redis.key
tls-ca-cert-file /tls/ca.crt
# İstemci sertifikası (mTLS) istenmiyor; zorunlu yapmak için "yes"
tls-auth-clients no
tls-protocols "TLSv1.2 TLSv1.3"
tls-prefer-server-ciphers yes
tls-session-caching yes

################################ SECURITY ####################################
aclfile /usr/local/etc/redis/users.acl
acllog-max-len 256
enable-protected-configs no
enable-debug-command no
enable-module-command no

################################ GENERAL #####################################
daemonize no
supervised no
loglevel notice
logfile ""
databases 16
always-show-logo no
set-proc-title no

################################ MEMORY ######################################
# mem_limit=3g → fork (BGSAVE/AOF rewrite) için pay bırakıldı
maxmemory 2gb
maxmemory-policy allkeys-lru
maxmemory-samples 5

# Tüm istemci bağlantılarının (query/output buffer) toplam belleği. Aşılınca en çok
# bellek kullanan bağlantı kapatılır; böylece tek bir uygulamanın büyük yanıtları
# diğerlerinin key'lerini sildirmez veya container'ı OOM'a sokmaz.
maxmemory-clients 256mb

# Tek bir değerin ve tek bir istemcinin sorgu buffer'ının üst sınırı (varsayılan 512mb / 1gb)
proto-max-bulk-len 64mb
client-query-buffer-limit 64mb

lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
lazyfree-lazy-server-del yes
lazyfree-lazy-user-del yes
lazyfree-lazy-user-flush yes

############################## PERSISTENCE ###################################
dir /data
dbfilename dump.rdb
save 3600 1 300 100 60 10000
stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes

appendonly yes
appendfilename "appendonly.aof"
appenddirname "appendonlydir"
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb
aof-use-rdb-preamble yes

############################### SHUTDOWN #####################################
# compose stop_grace_period (60s) bundan büyük olmalı
shutdown-timeout 10
shutdown-on-sigterm default

############################ SLOW LOG / LATENCY ##############################
slowlog-log-slower-than 10000
slowlog-max-len 256
latency-monitor-threshold 100

############################ CLIENT BUFFERS ##################################
client-output-buffer-limit normal 0 0 0
client-output-buffer-limit replica 256mb 64mb 60
client-output-buffer-limit pubsub 32mb 8mb 60
